# Disposable Access Server instances for the as-mcp-server dev loop.
# Only the Admin UI / Web API port (943) is published; VPN ports are not needed for API tests.
services:
  as-latest:
    # Built locally from the official packages: 3.2.4 has no Docker Hub image yet.
    build: ./as-latest
    image: as-mcp-dev/openvpn-as:3.2.4-f3c295a7-Ubuntu26
    container_name: as-latest
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - MKNOD
    ports:
      - "943:943"
    volumes:
      - as-latest-data:/openvpn
    networks:
      default: {}
      probe:
        ipv4_address: 10.77.0.2
    restart: unless-stopped

  # Compatibility target (minimum supported version). Start on demand:
  #   docker compose --profile compat up -d
  as-3-1-0:
    image: openvpn/openvpn-as:3.1.0-e22fe316-Ubuntu24
    container_name: as-3-1-0
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - MKNOD
    ports:
      - "944:943"
    volumes:
      - as-3-1-0-data:/openvpn
    networks:
      default: {}
      probe:
        ipv4_address: 10.77.0.3
    restart: unless-stopped
    profiles:
      - compat

  # RADIUS server that always answers with a challenge/response round.
  # Reached by the Access Server containers as host "radius" on the compose network.
  radius:
    image: freeradius/freeradius-server:3.2.10-alpine
    container_name: dev-radius
    command: ["-X"]
    volumes:
      - ./radius/clients.conf:/etc/raddb/clients.conf:ro
      - ./radius/default:/etc/raddb/sites-enabled/default:ro
    restart: unless-stopped

  # Two hosts that a VPN user reaches only through an access rule: only the Access
  # Server containers are on the probe network. Each answers ping and HTTP on 8080/8081.
  probe-t1:
    build: ./vpn-client3
    image: as-mcp-dev/vpn-client3:1
    container_name: probe-t1
    entrypoint: ["sh", "-c", "cd /tmp && python3 -m http.server 8080 & cd /tmp && python3 -m http.server 8081 & wait"]
    networks:
      probe:
        ipv4_address: 10.77.0.10
        aliases: [t1.mcpprobe.test]
    restart: unless-stopped

  probe-t2:
    image: as-mcp-dev/vpn-client3:1
    container_name: probe-t2
    entrypoint: ["sh", "-c", "cd /tmp && python3 -m http.server 8080 & cd /tmp && python3 -m http.server 8081 & wait"]
    depends_on: [probe-t1]
    networks:
      probe:
        ipv4_address: 10.77.0.11
        aliases: [t2.mcpprobe.test]
    restart: unless-stopped

networks:
  probe:
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  as-latest-data:
  as-3-1-0-data:
